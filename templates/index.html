<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="card">
        <!-- 標題 -->
        <header class="header">
            <h1><span class="emoji">🤖</span> AI 程式練習助手</h1>
            <p class="subtitle">這是一個用於練習程式設計的AI助理<br>請在下方選擇主題，並點擊「幫我出題」按鈕</p>
        </header>

        <!-- 選擇主題表單 -->
        <form method="post">
            <section class="section">
                <h3 class="section-title">請選擇學習主題：</h3>
                
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="topic" value="輸入輸出" {% if topic == '輸入輸出' %}checked{% endif %}>
                        <span>輸入輸出</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="topic" value="條件判斷" {% if topic == '條件判斷' %}checked{% endif %}>
                        <span>條件判斷</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="topic" value="迴圈" {% if topic == '迴圈' %}checked{% endif %}>
                        <span>迴圈</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="topic" value="串列" {% if topic == '串列' %}checked{% endif %}>
                        <span>串列</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" name="action" value="generate">幫我出題</button>
                <p style="margin-top: 12px;">目前選擇的主題：<strong>{{ topic }}</strong></p>
            </section>
        </form>

        <!-- AI 出題與動態選項區塊 -->
        <section class="info-box">
            <h2>AI 出題</h2>
            
            {% if question_data %}
                <p style="margin-top: 10px; color: #333; font-weight: bold;">{{ question_text }}</p>
                
                <form method="POST">
                    <input type="hidden" name="topic" value="{{ topic }}">
                    
                    <div class="options-container">
                        <label class="blue-option-card">
                            <input type="radio" name="student_answer" value="A" {% if student_answer == 'A' %}checked{% endif %}>
                            A. {{ question_data["A"] }}
                        </label>
                        <label class="blue-option-card">
                            <input type="radio" name="student_answer" value="B" {% if student_answer == 'B' %}checked{% endif %}>
                            B. {{ question_data["B"] }}
                        </label>
                        <label class="blue-option-card">
                            <input type="radio" name="student_answer" value="C" {% if student_answer == 'C' %}checked{% endif %}>
                            C. {{ question_data["C"] }}
                        </label>
                        <label class="blue-option-card">
                            <input type="radio" name="student_answer" value="D" {% if student_answer == 'D' %}checked{% endif %}>
                            D. {{ question_data["D"] }}
                        </label>
                    </div>

                    <button type="submit" class="purple-full-btn" name="action" value="check">提交答案</button>
                </form>
            {% else %}
                <p>請選擇主題，然後點選「幫我出題」按鈕，AI將為您產生一個練習題目。</p>
            {% endif %}
        </section>

        <!-- AI 回饋區塊 -->
        {% if feedback %}
        <section class="info-box">
            <div class="feedback">
                <h2>AI 回饋</h2>
                <p>{{ feedback }}</p>
            </div>
        </section>
        {% endif %}
    </div>

</body>
</html>
